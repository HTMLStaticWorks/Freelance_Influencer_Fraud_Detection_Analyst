<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | TrustShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <!-- Top Controls -->
    <div class="position-fixed top-0 end-0 p-4 d-flex gap-2 z-3">
        <button id="rtlToggle" class="btn btn-outline-secondary btn-sm" title="Toggle RTL">
            <span class="small fw-bold">RTL</span>
        </button>
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm" title="Toggle Theme">
            <i class="bi bi-moon-fill"></i>
        </button>
    </div>

    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center py-5">
            <div class="col-md-5">
                <div class="card p-5 border-0 shadow-sm text-center">
                    <a href="index.html" class="navbar-brand d-flex align-items-center justify-content-center mb-4">
                        <i class="bi bi-shield-check text-secondary me-2 fs-1"></i>
                        <span class="fw-bold fs-2 text-dark theme-text">TrustShield</span>
                    </a>
                    <h3 class="fw-bold mb-2">Create Account</h3>
                    <p class="text-muted small mb-4">Start securing your influencer campaigns today.</p>
                    
                    <form class="text-start">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" class="form-control py-2" placeholder="John Doe">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Work Email</label>
                            <input type="email" class="form-control py-2" placeholder="name@company.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control py-2" id="regPassword" placeholder="••••••••">
                                <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePassword('regPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Confirm Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control py-2" id="confirmPassword" placeholder="••••••••">
                                <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePassword('confirmPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-4 small text-muted text-center">
                            By signing up, you agree to our <a href="#" class="text-secondary text-decoration-none">Terms</a> and <a href="#" class="text-secondary text-decoration-none">Privacy Policy</a>.
                        </div>
                        <a href="dashboard.html" class="btn btn-primary w-100 py-2 mb-4">Create Account</a>
                        
                        <div class="text-center mb-4 position-relative">
                            <hr>
                            <span class="position-absolute top-50 start-50 translate-middle bg-body px-3 small text-muted">Or sign up with</span>
                        </div>
                        
                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-secondary w-100 py-2 small d-flex align-items-center justify-content-center">
                                    <i class="bi bi-google me-2"></i> Google
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-secondary w-100 py-2 small d-flex align-items-center justify-content-center">
                                    <i class="bi bi-apple me-2"></i> Apple
                                </button>
                            </div>
                        </div>
                        
                        <p class="text-center small text-muted mb-0">Already have an account? <a href="login.html" class="text-secondary fw-bold text-decoration-none">Login</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
